<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPE — Qatar NT</title>
<style>
  :root {
    --maroon: #8B0000;
    --maroon-light: #a50000;
    --bg: #f5f5f5;
    --white: #ffffff;
    --border: #ddd;
    --text: #1a1a1a;
    --ticked: #2e7d32;
    --row-alt: #fafafa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); }

  header {
    background: var(--maroon);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.3rem; letter-spacing: 1px; }
  header .subtitle { font-size: 0.8rem; opacity: 0.75; }

  .toolbar {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type="text"] {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.85rem;
    width: 200px;
  }
  .toolbar label { font-size: 0.85rem; color: #555; }

  .btn {
    padding: 7px 16px;
    border: none;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--maroon); color: #fff; }
  .btn-primary:hover { background: var(--maroon-light); }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-secondary:hover { background: #ccc; }
  .btn-reset { background: #fff3e0; color: #e65100; border: 1px solid #e65100; }
  .btn-reset:hover { background: #ffe0b2; }
  .btn-pdf { background: #1a237e; color: #fff; }
  .btn-pdf:hover { background: #283593; }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar, .footer, .stats-bar { display: none !important; }
    header { padding: 8px 16px; position: relative; min-height: 50px; }
    #session-label { position: absolute; top: 8px; right: 16px; font-size: 0.78rem; text-align: right; opacity: 1; color: #fff; }
    body { background: #fff; }
    .table-wrap { padding: 4px 8px; overflow: visible; }
    table { box-sizing: border-box; min-width: unset; width: 280px !important; border-collapse: collapse; table-layout: fixed; }
    thead th.tick-col, td.tick-td,
    thead th.select-col, td:last-child { display: none !important; }
    thead th:first-child { width: 200px; padding: 2px 6px; font-size: 0.72rem; }
    thead th.rpe-col { width: 60px; text-align: right; padding: 2px 6px; font-size: 0.72rem; }
    td { padding: 1px 6px; font-size: 0.72rem; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; line-height: 1.3; }
    td:first-child { width: 200px; }
    td.rpe-td { width: 60px; font-size: 0.78rem; font-weight: 700; text-align: right; }
    .rpe-display { height: 16px; line-height: 16px; min-width: 18px; font-size: 0.72rem; border-radius: 3px; display: inline-block; text-align: center; }
  }

  .stats-bar {
    display: flex;
    gap: 18px;
    padding: 8px 20px;
    background: #fff8f8;
    border-bottom: 1px solid #f0d0d0;
    font-size: 0.82rem;
    flex-wrap: wrap;
  }
  .stat { display: flex; gap: 5px; align-items: center; }
  .stat-label { color: #777; }
  .stat-value { font-weight: 700; color: var(--maroon); }

  .table-wrap { overflow-x: auto; padding: 16px 20px; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border-radius: 6px;
    overflow: hidden;
    min-width: 700px;
  }
  thead tr { background: var(--maroon); color: #fff; }
  thead th {
    padding: 10px 12px;
    text-align: left;
    font-size: 0.82rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  thead th.rpe-col { text-align: center; width: 60px; }
  thead th.tick-col { width: 44px; text-align: center; }
  thead th.select-col { text-align: left; }

  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #fff0f0; }

  td {
    padding: 7px 12px;
    font-size: 0.85rem;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  td.tick-td { text-align: center; }
  td.rpe-td { text-align: center; font-weight: 700; font-size: 1rem; min-width: 50px; }

  .tick-btn {
    width: 28px; height: 28px;
    border: 2px solid #ccc;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    font-size: 1rem;
    color: transparent;
    transition: all 0.15s;
  }
  .tick-btn.ticked {
    background: var(--ticked);
    border-color: var(--ticked);
    color: #fff;
  }

  .rpe-display {
    display: inline-block;
    min-width: 36px;
    height: 32px;
    line-height: 32px;
    border-radius: 4px;
    background: #eee;
    color: #999;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }
  .rpe-display.has-value { background: var(--maroon); color: #fff; }

  .rpe-btn-group { display: flex; flex-wrap: nowrap; gap: 3px; }
  .rpe-btn {
    width: 28px; height: 28px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #f9f9f9;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    color: #444;
  }
  .rpe-btn:hover { background: #e8e8e8; }
  .rpe-btn.selected { background: var(--maroon); color: #fff; border-color: var(--maroon); }

  .footer {
    text-align: center;
    padding: 12px;
    font-size: 0.75rem;
    color: #aaa;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="subtitle">Qatar National Team</div>
    <h1>RPE Collection</h1>
  </div>
  <div id="session-label" style="font-size:0.82rem;opacity:0.85;position:absolute;top:10px;right:16px;"></div>
</header>

<div class="toolbar">
  <label>Session:</label>
  <input type="text" id="session-input" placeholder="e.g. MD-1 Morning" oninput="updateSession()">
  <button class="btn btn-primary" onclick="exportCSV()">Export CSV</button>
  <button class="btn btn-pdf" onclick="openPrintView()">Print View</button>
  <button class="btn btn-secondary" onclick="resetAll()">Reset RPE</button>
  <button class="btn btn-reset" onclick="resetTicks()">Reset Ticks</button>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-label">Completed:</span><span class="stat-value" id="stat-done">0</span></div>
  <div class="stat"><span class="stat-label">Pending:</span><span class="stat-value" id="stat-pending">0</span></div>
  <div class="stat"><span class="stat-label">Avg RPE:</span><span class="stat-value" id="stat-avg">—</span></div>
  <div class="stat"><span class="stat-label">Max RPE:</span><span class="stat-value" id="stat-max">—</span></div>
  <div class="stat"><span class="stat-label">Ticked:</span><span class="stat-value" id="stat-ticked">0</span></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th class="tick-col">✓</th>
        <th class="rpe-col">RPE</th>
        <th class="select-col">Select</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer">Qatar NT Performance Dept · RPE Tool</div>

<script>
const PLAYERS = [
"MESHAAL BARSHAM","SALAH ZAKARIA","SHEHAB ELLETHY","MAHMOUD ABUNADA",
  "ABDELAZIZ HATIM","AHMED ALAAEILDIN","AHMED ALGANEHI","AHMED FATHI",
  "AKRAM AFIF","ALMOEZ ALI","ASSIM MADIBO",
  "AYOUB AL-OUI","BASSAM AL-RAWI","BOUALEM KHOUKHI","EDMILSON JUNIOR",
  "GUAEYE LAYE","HASAN AL-HAYDOS","HASHIM ALI","HOMAM AHMED",
  "IBRAHIM AL-HASSAN","JASSEM GABER","KARIM BOUDIAF","MOHAMMED ALMANAI",
  "NIALL MASON","SULTAN AL-BRAKE",
  "TAREK SALMAN","YUSUF YUSUF","YOUSSEF AYMAN"
];

let data = {};
PLAYERS.forEach(p => { data[p] = { tick: false, rpe: '' }; });

function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  PLAYERS.forEach(player => {
    const d = data[player];
    const tr = document.createElement('tr');
    const key = player.replace(/\s+/g,'_');

    tr.innerHTML = `
      <td>${player}</td>
      <td class="tick-td">
        <button class="tick-btn ${d.tick ? 'ticked' : ''}" id="tick_${key}" onclick="toggleTick('${player}')">✓</button>
      </td>
      <td class="rpe-td">
        <div class="rpe-display ${d.rpe !== '' ? 'has-value' : ''}" id="rpedisp_${key}">${d.rpe !== '' ? d.rpe : '—'}</div>
      </td>
      <td>
        <div class="rpe-btn-group" id="rpegrp_${key}"></div>
      </td>
    `;
    tbody.appendChild(tr);

    // Build RPE buttons 0–10
    const grp = document.getElementById(`rpegrp_${key}`);
    for (let i = 0; i <= 10; i++) {
      const b = document.createElement('button');
      b.className = 'rpe-btn' + (String(d.rpe) === String(i) ? ' selected' : '');
      b.textContent = i;
      b.addEventListener('click', (function(val, p, k) {
        return function() {
          document.querySelectorAll(`#rpegrp_${k} .rpe-btn`).forEach(x => x.classList.remove('selected'));
          this.classList.add('selected');
          data[p].rpe = String(val);
          const disp = document.getElementById(`rpedisp_${k}`);
          disp.textContent = val;
          disp.classList.add('has-value');
          updateStats();
        };
      })(i, player, key));
      grp.appendChild(b);
    }
  });
  updateStats();
}

function toggleTick(player) {
  data[player].tick = !data[player].tick;
  const key = player.replace(/\s+/g,'_');
  const btn = document.getElementById(`tick_${key}`);
  btn.classList.toggle('ticked', data[player].tick);
  updateStats();
}

function updateStats() {
  const vals = PLAYERS.filter(p => data[p].rpe !== '').map(p => parseInt(data[p].rpe));
  const ticked = PLAYERS.filter(p => data[p].tick).length;
  document.getElementById('stat-done').textContent = vals.length;
  document.getElementById('stat-pending').textContent = PLAYERS.length - vals.length;
  document.getElementById('stat-avg').textContent = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
  document.getElementById('stat-max').textContent = vals.length ? Math.max(...vals) : '—';
  document.getElementById('stat-ticked').textContent = ticked;
}

function updateSession() {
  document.getElementById('session-label').textContent = document.getElementById('session-input').value;
}

function openPrintView() {
  const session = document.getElementById('session-input').value || '';
  const rows = PLAYERS.map(p => {
    const rpe = data[p].rpe !== '' ? data[p].rpe : '—';
    const bg = data[p].rpe !== '' ? 'background:#8B0000;color:#fff;' : 'background:#eee;color:#999;';
    return `<tr>
      <td>${p}</td>
      <td><span style="display:inline-block;min-width:28px;height:22px;line-height:22px;border-radius:3px;text-align:center;font-weight:700;font-size:0.85rem;${bg}">${rpe}</span></td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>RPE — Qatar NT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; padding: 20px; }
    header { background: #8B0000; color: #fff; padding: 10px 16px; border-radius: 4px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; }
    header h1 { font-size: 1.1rem; }
    header .sub { font-size: 0.75rem; opacity: 0.8; }
    header .date { font-size: 0.8rem; font-weight: 600; }
    table { border-collapse: collapse; width: 280px; }
    thead tr { background: #8B0000; color: #fff; }
    thead th { padding: 5px 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    thead th:last-child { text-align: right; width: 60px; }
    tbody tr:nth-child(even) { background: #fafafa; }
    td { padding: 3px 8px; font-size: 0.78rem; border-bottom: 1px solid #eee; }
    td:last-child { text-align: right; width: 60px; }
    .footer { margin-top: 10px; font-size: 0.68rem; color: #aaa; }
  </style>
  </head><body>
  <header>
    <div><div class="sub">Qatar National Team</div><h1>RPE Collection</h1></div>
    <div class="date">${session}</div>
  </header>
  <table>
    <thead><tr><th>Player</th><th style="text-align:right">RPE</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="footer">Qatar NT Performance Dept</div>
  </body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

function exportCSV() {
  const session = document.getElementById('session-input').value || 'Session';
  let csv = 'Player,Tick,RPE,Session\n';
  PLAYERS.forEach(p => {
    csv += `"${p}",${data[p].tick ? 1 : 0},${data[p].rpe !== '' ? data[p].rpe : ''},${session}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rpe_${session.replace(/\s+/g,'_')}_QatarNT.csv`;
  a.click();
}

function resetAll() {
  PLAYERS.forEach(p => { data[p].rpe = ''; });
  buildTable();
}

function resetTicks() {
  PLAYERS.forEach(p => { data[p].tick = false; });
  buildTable();
}

buildTable();

// Set today's date — Doha timezone (UTC+3)
const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Qatar' }));
const dateStr = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
document.getElementById('session-input').value = dateStr;
document.getElementById('session-label').textContent = dateStr;
</script>
</body>
</html>
